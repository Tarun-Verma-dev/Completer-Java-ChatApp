version: "3.9"

services:

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: ${AUTH_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASS}
      SPRING_MAIL_USERNAME: ${AUTH_MAIL_USER}
      SPRING_MAIL_PASSWORD: ${AUTH_MAIL_PASS}
      SERVER_PORT: 8081
    depends_on: []

  chat-service:
    build: ./chat-service
    container_name: chat-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: ${CHAT_MONGO_URL}
      SPRING_DATA_MONGODB_DATABASE: ${CHAT_MONGO_DB}
      SERVER_PORT: 8082
    depends_on: []
